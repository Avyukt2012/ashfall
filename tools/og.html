<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Clash';src:url('../fonts/ClashDisplay-700.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Array';src:url('../fonts/Array-400.woff2') format('woff2');font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0a0908;overflow:hidden;position:relative;font-family:'Satoshi'}
.warden{position:absolute;right:-96px;top:50%;transform:translateY(-50%);opacity:.95}
.wrap{position:relative;z-index:2;padding:74px 80px;height:100%;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:'Array';font-size:15px;letter-spacing:.46em;color:#8b8172;display:flex;align-items:center;gap:20px;margin-bottom:26px}
.eyebrow i{width:74px;height:2px;background:#ff3d1f;display:block}
h1{font-family:'Clash';font-weight:700;font-size:143px;line-height:.8;letter-spacing:-.055em;color:#f2ece1;white-space:nowrap}
h1 span{color:#ff3d1f}
.rule{height:1px;background:rgba(242,236,225,.16);margin:34px 0 28px;width:540px}
p{font-size:24px;line-height:1.46;color:#8b8172;max-width:540px}
p b{color:#d9ff4a;font-weight:500}
.vig{position:absolute;inset:0;z-index:3;background:radial-gradient(130% 100% at 38% 50%,transparent 46%,#050404 100%)}
</style>
</head>
<body>
<svg class="warden" width="620" height="620" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d1f" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ff3d1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0b0a"/>
      <stop offset="62%" stop-color="#0d0b0a"/>
      <stop offset="100%" stop-color="#8c2410"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#glow)"/>
  <g stroke="#ff3d1f" stroke-width="3" opacity=".55" fill="none">
    <path d="M200 58 A142 142 0 0 1 320 130"/><path d="M62 232 A142 142 0 0 0 150 330"/>
    <path d="M330 250 A142 142 0 0 1 250 336"/>
  </g>
  <g stroke="#d9ff4a" stroke-width="3" opacity=".45" fill="none">
    <path d="M200 22 A178 178 0 0 1 355 120"/><path d="M40 275 A178 178 0 0 0 120 350"/>
  </g>
  <polygon points="200,92 282,138 300,232 236,302 152,296 104,214 128,124"
           fill="url(#body)" stroke="#f2ece1" stroke-width="2.6"/>
  <g stroke="#ff3d1f" stroke-width="3.4" opacity=".85" fill="none">
    <path d="M200 205 L246 152 M200 205 L168 268 M200 205 L272 224 M200 205 L142 178"/>
  </g>
  <circle cx="200" cy="205" r="26" fill="#ff3d1f" opacity=".35"/>
  <circle cx="200" cy="205" r="11" fill="#f4ede0"/>
  <g fill="#ff3d1f" opacity=".8">
    <polygon points="352,196 336,204 340,192"/><polygon points="66,150 82,158 70,164"/>
    <polygon points="300,338 286,330 298,324"/>
  </g>
</svg>
<div class="wrap">
  <p class="eyebrow"><i></i>A DUEL IN THREE MOVEMENTS</p>
  <h1>ASH<span>F</span>ALL</h1>
  <div class="rule"></div>
  <p>Read its intent. Bank your charge. Spend it before a <b>Sunder</b> shatters what you hold.</p>
</div>
<div class="vig"></div>
</body>
</html>
